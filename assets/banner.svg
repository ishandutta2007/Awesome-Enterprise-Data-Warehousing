<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="purple-glow" cx="85%" cy="70%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes wave-shift{0%{transform:translateX(0)}50%{transform:translateX(-60px)}}@keyframes pulse-glow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes pulse-particle{0%{opacity:.2;transform:translateY(0)}50%{opacity:.9;transform:translateY(-12px)}}@keyframes stream-flow{0%{stroke-dashoffset:400}}.pill-text,.subtitle-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px;fill:url(#title-grad)}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.tagline-text{font-weight:400;font-size:15px;fill:#64748b}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.animated-wave{animation:wave-shift 12s ease-in-out infinite}.glow-orb-1{transform-origin:240px 140px;animation:pulse-glow 7s ease-in-out infinite}.glow-orb-2{transform-origin:1000px 300px;animation:pulse-glow 9s ease-in-out infinite}.particle-1{animation:pulse-particle 4s ease-in-out infinite}.particle-2{animation:pulse-particle 5s ease-in-out infinite 1.5s}.particle-3{animation:pulse-particle 4.5s ease-in-out infinite .8s}.stream-line{stroke-dasharray:20 15;animation:stream-flow 20s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="240" cy="140" r="260" fill="url(#cyan-glow)" class="glow-orb-1"/><circle cx="1000" cy="300" r="280" fill="url(#purple-glow)" class="glow-orb-2"/><g opacity=".45"><path fill="none" stroke="#06b6d4" stroke-width="2.5" d="M-50,330 C200,280 400,370 700,310 C950,260 1100,340 1250,290" class="stream-line animated-wave"/><path fill="none" stroke="#8b5cf6" stroke-width="2" d="M-50,360 C250,300 480,390 780,330 C1000,280 1150,360 1250,320" class="stream-line animated-wave"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M-50,390 C180,340 420,410 720,360 C920,320 1120,380 1250,350" class="stream-line animated-wave"/></g><circle cx="180" cy="90" r="3.5" fill="#38bdf8" class="particle-1"/><circle cx="940" cy="110" r="4" fill="#a855f7" class="particle-2"/><circle cx="1060" cy="190" r="3" fill="#06b6d4" class="particle-3"/><circle cx="120" cy="270" r="2.5" fill="#818cf8" class="particle-2"/><circle cx="1120" cy="70" r="3" fill="#38bdf8" class="particle-1"/><g transform="translate(435, 45)"><rect width="330" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#10b981"/><text x="32" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED KNOWLEDGE BASE</text></g><text x="600" y="132" class="title-text" text-anchor="middle">Awesome Enterprise Data Warehousing</text><text x="600" y="172" class="subtitle-text" text-anchor="middle">Cloud SaaS Platforms • MPP Engines • Lakehouse Analytics • Open Architecture</text><text x="600" y="202" class="tagline-text" text-anchor="middle">Production-proven analytical engines, market dynamics, cost modeling, and architectural patterns</text><g><g transform="translate(130, 240) translate(0, 0)"><rect width="160" height="42" fill="url(#pill-grad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.2" rx="10"/><text x="80" y="26" class="pill-text" text-anchor="middle">⚡ MPP Compute</text></g><g transform="translate(130, 240) translate(190, 0)"><rect width="180" height="42" fill="url(#pill-grad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1.2" rx="10"/><text x="90" y="26" class="pill-text" text-anchor="middle">📦 Storage-Compute</text></g><g transform="translate(130, 240) translate(400, 0)"><rect width="180" height="42" fill="url(#pill-grad)" stroke="#a855f7" stroke-opacity=".4" stroke-width="1.2" rx="10"/><text x="90" y="26" class="pill-text" text-anchor="middle">🌊 Lakehouse Tables</text></g><g transform="translate(130, 240) translate(610, 0)"><rect width="160" height="42" fill="url(#pill-grad)" stroke="#06b6d4" stroke-opacity=".4" stroke-width="1.2" rx="10"/><text x="80" y="26" class="pill-text" text-anchor="middle">🚀 Sub-Second BI</text></g><g transform="translate(130, 240) translate(800, 0)"><rect width="140" height="42" fill="url(#pill-grad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1.2" rx="10"/><text x="70" y="26" class="pill-text" text-anchor="middle">🔒 Governance</text></g></g><rect width="700" height="3" x="250" y="380" fill="url(#title-grad)" opacity=".8" rx="1.5"/></svg>